# ============================================================
# Employee Payroll Management System
# Spring Boot Configuration
# ============================================================

# â”€â”€â”€ Server â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Render provides PORT automatically.
# Locally, the application will use port 8080.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}


# â”€â”€â”€ MySQL Database â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Aiven MySQL connection
#
# MySQL port = 12421
# MySQLX port = 12425  <-- NOT used by Spring Boot JDBC
#
# DB_URL can be overridden through an environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://employee-payroll-mysql-employee-payroll-db.d.aivencloud.com:12421/payroll_db?sslMode=REQUIRED&serverTimezone=UTC}

# Aiven username
spring.datasource.username=${DB_USERNAME:avnadmin}

# IMPORTANT:
# Set DB_PASSWORD in your environment variables in Render.
# Do NOT commit the real password to GitHub.
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# â”€â”€â”€ JPA / Hibernate â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Automatically creates/updates tables according to the entities.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in development logs.
spring.jpa.show-sql=true

# Format SQL queries for readability.
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# â”€â”€â”€ Jackson â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Pretty-print JSON responses.
spring.jackson.serialization.indent-output=true


# â”€â”€â”€ JWT Configuration â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# IMPORTANT:
# Use a strong secret through the JWT_SECRET environment variable.
# Do NOT commit a production JWT secret to GitHub.
jwt.secret=${JWT_SECRET}

# 24 hours = 86400000 milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}
