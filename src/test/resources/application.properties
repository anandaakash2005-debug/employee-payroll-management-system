# Test profile uses H2 in-memory DB (no MySQL needed for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# ========== JWT CONFIGURATION ==========
jwt.secret=dGVzdC1vbmx5LWtleS1mb3ItaW50ZWdyYXRpb24tdGVzdHM=
jwt.expiration=86400000
spring.flyway.enabled=false
payroll.scheduling.enabled=false
payroll.seed-demo=false
spring.jpa.open-in-view=false
